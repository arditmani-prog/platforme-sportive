<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Analytics SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0b192c; --accent: #1e3e62; --brand-red: #d90429; --bg-body: #f1f5f9; --text-dark: #0f172a; --text-muted: #64748b; --border: #cbd5e1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-dark); min-height: 100vh; }
        
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 25, 44, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .auth-card { background: white; padding: 32px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); text-align: center; }
        .auth-card h2 { color: var(--primary); font-size: 22px; margin-bottom: 8px; }
        .auth-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 4px; display: block; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-main { flex: 1; background: var(--brand-red); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-secondary { flex: 1; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px; }

        #app-layout { display: none; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--primary); color: white; padding: 24px 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .main-content { flex: 1; padding: 30px; }
        .btn-logout { background: #e2e8f0; color: var(--text-dark); border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Hyni në Platformë</h2>
            <p>Sistemi i sigurt i menaxhimit të akademisë</p>

            <div class="form-group">
                <label>Email-i Zyrtar</label>
                <input type="email" id="auth-email" placeholder="klubi@ekipi.com">
            </div>
            <div class="form-group">
                <label>Fjalëkalimi</label>
                <input type="password" id="auth-password" placeholder="••••••••">
            </div>

            <div class="btn-group">
                <button type="button" class="btn-main" onclick="kryejHyrjen()">HYR</button>
                <button type="button" class="btn-secondary" onclick="kryejRegjistrimin()">REGJISTROHU</button>
            </div>
        </div>
    </div>

    <div id="app-layout">
        <div class="sidebar">
            <div>
                <h2 style="font-size: 18px;">SPORTS HUB SAAS</h2>
                <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;" id="user-display-email">Llogaria e Aktivizuar</div>
            </div>
            <button class="btn-logout" onclick="dilNgaSistemi()">🚪 Dil nga Sistemi</button>
        </div>

        <div class="main-content">
            <h1 style="font-size: 24px; color: var(--primary);">Paneli i Kontrollit të Lojtarëve</h1>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Platforma juaj është lidhur me sukses me Supabase Cloud!</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nwjcbhqjtbxlpzftgrxa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53amNiaHFqdGJ4bHB6ZnRncnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzMwMjEsImV4cCI6MjEwMTY0OTAyMX0.vCi0s9xIb8uAzKe-KcWPoBVlfwY84y6SSg9KTt9s3PE';
        
        var clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function kryejHyrjen() {
            var emriEmail = document.getElementById('auth-email').value;
            var fjalekalimi = document.getElementById('auth-password').value;

            if(!emriEmail || !fjalekalimi) {
                alert("Ju lutem plotësoni email-in dhe fjalëkalimin!");
                return;
            }

            var pergjigja = await clientSupabase.auth.signInWithPassword({ email: emriEmail, password: fjalekalimi });
            if (pergjigja.error) {
                alert("Gabim gjatë hyrjes: " + pergjigja.error.message);
            } else {
                verifikoPerdoruesin(pergjigja.data.user);
            }
        }

        async function kryejRegjistrimin() {
            var emriEmail = document.getElementById('auth-email').value;
            var fjalekalimi = document.getElementById('auth-password').value;

            if(!emriEmail || !fjalekalimi) {
                alert("Ju lutem plotësoni email-in dhe fjalëkalimin për t'u regjistruar!");
                return;
            }

            var pergjigja = await clientSupabase.auth.signUp({ email: emriEmail, password: fjalekalimi });
            if (pergjigja.error) {
                alert("Gabim gjatë regjistrimit: " + pergjigja.error.message);
            } else {
                alert("✅ Llogaria u krijua me sukses! Tani klikoni butonin HYR.");
            }
        }

        async function verifikoPerdoruesin(userSeksioni) {
            var perdoruesi = userSeksioni;
            if(!perdoruesi) {
                var res = await clientSupabase.auth.getUser();
                perdoruesi = res.data ? res.data.user : null;
            }

            if (perdoruesi) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app-layout').style.display = 'flex';
                document.getElementById('user-display-email').innerText = perdoruesi.email;
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
                document.getElementById('app-layout').style.display = 'none';
            }
        }

        async function dilNgaSistemi() {
            await clientSupabase.auth.signOut();
            verifikoPerdoruesin(null);
        }

        window.onload = function() {
            verifikoPerdoruesin();
        };
    </script>
</body>
</html>
